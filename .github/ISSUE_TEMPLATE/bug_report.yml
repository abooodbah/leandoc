name: Bug report
description: Report a reproducible problem in LeanDoc
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve LeanDoc. Never attach a private document. Remove private information from files, screenshots, and logs.

  - type: input
    id: version
    attributes:
      label: LeanDoc version
      description: Enter the release version or commit you tested.
      placeholder: "For example: 0.1.0 or commit abc1234"
    validations:
      required: true

  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - Ubuntu 24.04 or compatible Debian-based distribution
        - macOS on Apple silicon
        - macOS on Intel
        - Other setup
    validations:
      required: true

  - type: input
    id: web-runtime-version
    attributes:
      label: System web runtime version
      description: The WebView2, WebKitGTK, or macOS version, if known.
      placeholder: "For example: WebView2 141.0.x or WebKitGTK 2.50.x"

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The shortest reliable sequence that shows the problem.
      placeholder: |
        1. Open ...
        2. Select ...
        3. See ...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: What happened, including any visible message.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: What you expected LeanDoc to do.
    validations:
      required: true

  - type: textarea
    id: inspect
    attributes:
      label: leandoc-inspect output or a safe sample
      description: Paste the output of `leandoc-inspect FILE` (it ships in the Windows ZIP under tools), or attach a small test file you made yourself. Do not attach private documents.
      render: json

  - type: checkboxes
    id: confirmations
    attributes:
      label: Checks
      options:
        - label: I searched existing open and closed issues for this problem.
          required: true
        - label: I reproduced this with the latest release or a current build, or explained why I could not.
          required: true
        - label: This report does not describe a security vulnerability. I will follow SECURITY.md for those.
          required: true
