name: Deploy GitHub Pages

# Deploys site/ by hand. Tag builds deploy it from build.yml after the release
# is published, so this workflow exists for corrections between releases.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Verify launch site
        shell: bash
        run: |
          if [[ ! -f site/index.html ]]; then
            echo "::error title=No site::site/index.html does not exist on this ref; nothing to deploy."
            exit 1
          fi
          if [[ -f site/validate.mjs ]]; then
            node site/validate.mjs
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
